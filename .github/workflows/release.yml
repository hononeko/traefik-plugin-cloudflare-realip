name: Release

# Tags the next version from Conventional Commits and publishes a GitHub Release with grouped notes. Traefik loads
# the plugin from source, so the tag is the release; consumers fetch its source archive.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the next version and release notes without tagging
        type: boolean
        default: false

# Queue rather than cancel: a second dispatch (such as a dry run) must never abort a release mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Tag & Release
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Only main publishes
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releases are published from main only; dispatch with dry_run to check another branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Go modules need v-prefixed tags.
      - name: Version
        id: version
        uses: hononeko/actions/version@5532ca1e4b7254aed1f85fe64b6230941d6eed21 # v1.4.2
        with:
          tag-prefix: v

      - name: Nothing to release
        if: steps.version.outputs.version-type == 'none'
        run: echo "No releasable commits since ${{ steps.version.outputs.previous-tag }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes
        if: steps.version.outputs.version-type != 'none'
        uses: hononeko/actions/release-notes@5532ca1e4b7254aed1f85fe64b6230941d6eed21 # v1.4.2
        with:
          previous-tag: ${{ steps.version.outputs.previous-tag }}
          tag: ${{ steps.version.outputs.version-tag }}
          summary: Release notes for ${{ steps.version.outputs.version-tag }}

      - name: Tag & create the GitHub Release
        if: ${{ !inputs.dry_run && steps.version.outputs.version-type != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.version-tag }}
        run: gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "$VERSION_TAG" --notes-file release-notes.md
