displayName: Cloudflare Real IP
type: middleware
import: github.com/hononeko/traefik-plugin-cloudflare-realip
summary: >-
  Sets X-Forwarded-For and X-Real-Ip to CF-Connecting-IP for requests from trusted Cloudflare ranges, so backends
  that trust the left-most X-Forwarded-For entry can't be fed a client-forged address.
testData:
  trustedCIDRs:
    - 173.245.48.0/20
    - 2400:cb00::/32
